# ============================================================================
# 示例站点配置
#
# 【重要】建自己的站点时，把下面这份整个复制过去再改。
#
# 为什么不能只写 baseURL 和 title：Hugo 会合并主题的 [params]，
# 但不会合并主题的 [imaging]。图片处理参数必须写在站点这里，
# 否则 JPEG 质量会掉回 Hugo 默认的 75、重采样退回 box —— 对照片站是灾难。
# ============================================================================

baseURL = "/"
title   = "影集"

# 用本地主题目录；从 GitHub 拉下来时改成 theme = "photo-gallery"
# 注意：TOML 里裸键必须写在所有 [table] 之前，
# 写到 [imaging] 后面会被解析成 imaging.xxx.theme，静默失效。
theme = "../.."

defaultContentLanguage = "zh"
timeZone = "Asia/Shanghai"

# 本站只有「相册 + 归档」，用不到分类法。
# 不关掉的话，相册 front matter 里的 tags 会被当成 Hugo 内置标签分类，
# 生成一堆 /tags/ 页面（而且因为主题没有对应模板会报 warning）。
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# ---------------------------------------------------------------------------
# 图片处理 —— 必须放在站点配置里
#
# Hugo 处理 JPEG 的默认质量只有 75，对照片站明显偏糊，这里拉到 95。
# Lanczos 是缩图质量最好的重采样算法（默认的 box 快但糊）。
# ---------------------------------------------------------------------------
[imaging]
  resampleFilter = "Lanczos"

[imaging.jpeg]
  quality = 95

[imaging.webp]
  quality = 95
  hint    = "photo"

[imaging.avif]
  quality = 95
  hint    = "photo"

# ---------------------------------------------------------------------------
# 拉取远程图床图片的网络设置
#
# 相册 front matter 里写 remoteImages 时，Hugo 会用 resources.GetRemote 去下载，
# 下载受 security.http.urls 限制。默认策略会拦掉三类地址：
#   · 直接写 IP 的（http://1.2.3.4/x.jpg）
#   · localhost
#   · URL 里带凭据的（https://user:pass@host/x.jpg）
#
# 【代理 / 科学上网环境】Hugo 是按【解析后的 IP】校验的。开着 fake-IP 模式的
# 代理时，所有域名都解析成代理的保留地址（常见 198.18.x.x），于是连普通图床
# 域名都会被判成「IP 不在白名单」而拒绝下载，报错形如：
#     dial tcp 198.18.0.65:443: access denied: "198.18.0.65" is not whitelisted
#
# 正确解法是让 Hugo 走代理，而不是关掉校验 —— 加上下面这行，构建时带上
# 代理环境变量（端口按自己的代理改）：
#     HTTP_PROXY=http://127.0.0.1:1082 HTTPS_PROXY=http://127.0.0.1:1082 hugo
# 走代理后拨号目标是代理本身，Hugo 会跳过地址校验，其余防护照旧生效。
#
# 【不要】用 urls = ['(?i)^https?://'] 去绕过 —— 实测那样会把 Hugo 的地址
# 校验整个关掉（连 127.0.0.1 都能拉）。真要用也必须收窄到自己的图床域名。
# ---------------------------------------------------------------------------
[security.http]
  proxyFromEnvironment = true
