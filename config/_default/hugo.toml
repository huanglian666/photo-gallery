# ============================================================================
# 主题默认配置
#
# Hugo 会把主题的 config 与站点的合并，但【只合并 params】——
# [imaging] 之类的根级配置不会从主题带过来，必须写在站点自己的配置里。
# 所以这里只放 params，其余见 exampleSite/hugo.toml 的说明。
# ============================================================================

[params]
  # ---------- 品牌 ----------
  brandZh = "影集"
  brandEn = "PHOTOGRAPHY"

  # ---------- 首页牌堆 ----------
  deckCardMaxWidth = 380      # 单张牌最大宽度 px（实际还会受视口宽高约束）
  deckCardRatio    = 1.5      # 牌高 / 牌宽，2:3 是标准扑克比例

  # ---------- 图片网格 ----------
  gridGap          = 8        # 网格间距 px
  gridTargetHeight = 296      # 桌面端目标行高 px（窄屏自动缩小）

  # ---------- 图片流水线 ----------
  # 只有网格缩略图会被处理：把原图缩到显示尺寸。
  # 这不是压缩画质，而是不把 4000px 的原图塞进 300px 的格子。
  #
  # 灯箱看大图用的是【未经任何处理的原图】—— 模板里直接指向原始文件。
  # 所以无论下面怎么配，点开看到的永远是原图。
  thumbWidth   = 800          # 缩略图宽度 px
  thumbQuality = 95           # 95 基本视觉无损；想更狠可以给 100
  thumbFormat  = "auto"       # auto = 保持原格式不转码
                              # webp = 转 WebP，体积更小、画质等价
