{{- /* 全站共用的灯箱：分类页和归档页都走这一个 */ -}}
<div class="lightbox" id="lightbox">
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-tags" id="lb-tags"></div>
  <div class="lb-hint">点击放大 · 滚轮 / 双指缩放 · 拖动平移</div>
  <button class="lb-close" id="lb-close">关闭 ESC</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="上一张">
    <svg width="9" height="15" viewBox="0 0 9 15" fill="none" aria-hidden="true"><path d="M7.5 1L1 7.5 7.5 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="lb-nav lb-next" id="lb-next" aria-label="下一张">
    <svg width="9" height="15" viewBox="0 0 9 15" fill="none" aria-hidden="true"><path d="M1.5 1L8 7.5 1.5 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>
